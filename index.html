<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090714" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="아르카나라이브" />
  <title>아르카나 라이브 (Arcana Live)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Cinzel:wght@700;900&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #090714;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-pb { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 상단 앱 바 & 이중 지갑 -->
  <header class="sticky top-0 z-40 bg-[#0d0a1f]/95 backdrop-blur-md border-b border-purple-500/20 px-3 py-2.5">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      <div id="appLogo" class="flex items-center gap-2 cursor-pointer active:scale-95 transition">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-purple-600 to-amber-500 flex items-center justify-center text-base shadow-lg shadow-purple-500/30">🔮</div>
        <div>
          <h1 class="font-cinzel text-sm font-black tracking-wider text-amber-300 leading-none">ARCANA LIVE</h1>
          <p class="text-[10px] text-purple-300 mt-0.5">실시간 타로 상담 스튜디오</p>
        </div>
      </div>

      <!-- 설치 버튼 (지원 기기 자동 표시) -->
      <button id="installAppBtn" onclick="installPWA()" class="hidden px-2.5 py-1 rounded-lg bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black text-[11px] shadow">
        📲 앱 설치
      </button>

      <!-- 역할 전환 -->
      <div class="flex bg-slate-900/90 p-0.5 rounded-xl border border-purple-500/30 text-[11px] font-bold">
        <button id="btnRoleClient" onclick="switchRole('client')" class="px-2.5 py-1 rounded-lg bg-purple-600 text-white transition">🙋 내담자</button>
        <button id="btnRoleCounselor" onclick="switchRole('counselor')" class="px-2.5 py-1 rounded-lg text-slate-400 transition">🎙️ 상담사</button>
      </div>
    </div>

    <!-- 분리 문코인(MC) 잔액 바 -->
    <div class="max-w-md mx-auto mt-2 grid grid-cols-2 gap-2 text-[11px]">
      <div onclick="chargeCoin('client', 5000)" class="flex items-center justify-between bg-slate-900/90 border border-amber-500/30 rounded-lg px-2.5 py-1 cursor-pointer active:scale-95">
        <span class="text-slate-400">🙋 내담자 코인</span>
        <span class="font-black text-amber-300"><span id="clientCoinVal">15,000</span> MC <span class="text-[9px] bg-amber-500/20 px-1 rounded">+충전</span></span>
      </div>
      <div onclick="chargeCoin('counselor', 5000)" class="flex items-center justify-between bg-slate-900/90 border border-purple-500/30 rounded-lg px-2.5 py-1 cursor-pointer active:scale-95">
        <span class="text-slate-400">🎙️ 상담사 코인</span>
        <span class="font-black text-purple-300"><span id="counselorCoinVal">24,500</span> MC <span class="text-[9px] bg-purple-500/20 px-1 rounded">+적립</span></span>
      </div>
    </div>
  </header>

  <!-- 메인 앱 컨테이너 -->
  <main id="appMain" class="flex-1 max-w-md w-full mx-auto px-3 py-3 space-y-3 pb-24"></main>

  <!-- 카드 확대 & 해설 모달 -->
  <div id="cardModal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeCardModal()">
    <div class="bg-[#130f2b] border border-amber-400/40 rounded-3xl max-w-sm w-full p-4 space-y-3 shadow-2xl" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <span id="modalDeckBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-400/30">✨ 클래식 아르카나</span>
        <button onclick="closeCardModal()" class="w-7 h-7 rounded-full bg-slate-800 text-slate-300 text-sm">✕</button>
      </div>
      <div class="flex justify-center">
        <canvas id="modalCardCanvas" width="320" height="480" class="w-56 h-84 rounded-2xl shadow-2xl border-2 border-amber-400/60"></canvas>
      </div>
      <div class="text-center space-y-1">
        <h3 id="modalCardTitle" class="text-lg font-black text-amber-300">II. 여사제 (The High Priestess)</h3>
        <p id="modalCardKeywords" class="text-xs text-purple-300 font-bold">#직관 #비밀 #내면의지혜 #신비</p>
        <p id="modalCardDesc" class="text-xs text-slate-300 leading-relaxed bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-left"></p>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toastBox" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900/95 border border-amber-400/50 text-amber-200 text-xs font-bold px-4 py-2.5 rounded-full shadow-xl whitespace-nowrap"></div>

  <script>
    // 단일 파일 내장 PWA Manifest & Service Worker 자동 생성
    (function initEmbeddedPWA() {
      const manifest = {
        name: "아르카나 라이브 - 타로 상담 방송",
        short_name: "아르카나라이브",
        start_url: location.href,
        display: "standalone",
        background_color: "#090714",
        theme_color: "#7c3aed",
        icons: [{ src: "https://cdn-icons-png.flaticon.com/512/3655/3655586.png", sizes: "512x512", type: "image/png" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    })();

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installAppBtn').classList.remove('hidden');
    });
    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
      } else {
        showToast('브라우저 메뉴(⋮) → [홈 화면에 추가]를 눌러 설치하세요!');
      }
    }

    // 앱 상태 데이터
    const state = {
      role: 'client',
      counselorTab: 'live',
      clientCoin: 15000,
      counselorCoin: 24500,
      platformRevenue: 48500,
      activeDeck: 'cat',
      ownedDecks: ['classic', 'cat'],
      drawnCards: [
        { id: 2, revealed: true },
        { id: 1, revealed: false },
        { id: 17, revealed: false }
      ],
      micActive: false,
      spoonLive: true,
      chats: [
        { source: 'arcana', user: '달빛산책', text: '선생님 오늘 연애운 너무 궁금해요! 🌙', coin: 0 },
        { source: 'spoon', user: '별헤는밤(스푼)', text: '스푼 방송 보고 카드 화면 보러 넘어왔어요!', coin: 3000 }
      ],
      replyTemplates: {
        '일반 후원': '{닉네임}님 소중한 복채 감사합니다! 좋은 기운 가득 담아 리딩해 드릴게요 ✨',
        '고액 도네': '와아 {닉네임}님 특급 후원 정말 감사드립니다! 오늘 최고의 운세 기운 받아가세요 👑',
        '신규 환영': '{닉네임}님 어서 오세요! 1:1 질문은 여기서 바로 신청 가능해요 👉 {링크}'
      },
      selectedCategory: '일반 후원'
    };

    const DECKS = [
      { id: 'classic', name: '✨ 클래식 아르카나', price: 0, desc: '알폰스 무하풍 8등신 고전 여신과 스테인드글라스 성당 원화' },
      { id: 'cat', name: '🐱 냥이 신전 타로', price: 3000, desc: '초승달 왕관과 사제 제복을 입은 8등신 페르시안 고양이 수인 덱' },
      { id: 'rabbit', name: '🐰 포근 토끼 숲속 타로', price: 4500, desc: '들꽃 화관과 숲속 망토를 걸친 8등신 토끼 점성술사 일러스트' },
      { id: 'neon', name: '🔮 네온 사이버 미스틱', price: 6000, desc: '홀로그램 바이저와 사이버 롱코트를 입은 8등신 미래 사제 덱' }
    ];

    const MAJOR_CARDS = [
      { id: 0, num: '0', name: '바보 (The Fool)', kw: '#새로운시작 #자유 #순수 #모험', desc: '두려움 없이 첫발을 내딛는 순수한 에너지입니다. 새로운 기회와 설레는 출발이 눈앞에 있습니다.' },
      { id: 1, num: 'I', name: '마법사 (The Magician)', kw: '#창조 #능력발휘 #자신감 #실행력', desc: '원하는 것을 현실로 만들어낼 모든 도구와 재능이 이미 당신의 손안에 준비되어 있습니다.' },
      { id: 2, num: 'II', name: '여사제 (The High Priestess)', kw: '#직관 #신비 #내면의지혜 #비밀', desc: '겉으로 드러난 말보다 내면의 직감과 조용한 통찰을 믿어야 할 시기입니다.' },
      { id: 3, num: 'III', name: '여황제 (The Empress)', kw: '#풍요 #매력 #사랑 #결실', desc: '따뜻한 애정과 풍요로운 결실이 찾아옵니다. 스스로를 아끼고 사랑할수록 복이 따릅니다.' },
      { id: 6, num: 'VI', name: '연인 (The Lovers)', kw: '#운명적만남 #조화 #진심 #선택', desc: '마음이 깊이 통하는 인연과 조화로운 선택의 순간이 다가옵니다.' },
      { id: 9, num: 'IX', name: '은둔자 (The Hermit)', kw: '#성찰 #지혜탐구 #신중함 #등불', desc: '잠시 소음을 멈추고 내면의 등불을 비추며 진짜 원하는 길을 찾는 시간입니다.' },
      { id: 17, num: 'XVII', name: '별 (The Star)', kw: '#희망 #치유 #영감 #행운', desc: '어두운 밤하늘에 가장 밝게 빛나는 별처럼, 간절히 바라던 희망과 치유의 빛이 찾아옵니다.' },
      { id: 19, num: 'XIX', name: '태양 (The Sun)', kw: '#성공 #기쁨 #긍정 #활력', desc: '모든 구름이 걷히고 눈부신 성공과 기쁨이 가득한 최고의 길운입니다.' },
      { id: 21, num: 'XXI', name: '세계 (The World)', kw: '#완성 #성취 #해피엔딩 #새로운단계', desc: '오랜 노력이 완벽한 결실을 맺고 더 넓은 세상으로 나아가는 축복의 카드입니다.' }
    ];

    function getCardInfo(id) {
      return MAJOR_CARDS.find(c => c.id === id) || MAJOR_CARDS[2];
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => box.classList.add('hidden'), 2600);
    }

    function updateCoins() {
      document.getElementById('clientCoinVal').textContent = state.clientCoin.toLocaleString();
      document.getElementById('counselorCoinVal').textContent = state.counselorCoin.toLocaleString();
    }

    function chargeCoin(who, amount) {
      if (who === 'client') {
        state.clientCoin += amount;
        showToast(`🙋 내담자 문코인 +${amount.toLocaleString()} MC 충전 완료!`);
      } else {
        state.counselorCoin += amount;
        showToast(`🎙️ 상담사 문코인 +${amount.toLocaleString()} MC 적립 완료!`);
      }
      updateCoins();
      render();
    }

    function switchRole(role) {
      state.role = role;
      document.getElementById('btnRoleClient').className = role === 'client'
        ? 'px-2.5 py-1 rounded-lg bg-purple-600 text-white transition'
        : 'px-2.5 py-1 rounded-lg text-slate-400 transition';
      document.getElementById('btnRoleCounselor').className = role === 'counselor'
        ? 'px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 font-black transition'
        : 'px-2.5 py-1 rounded-lg text-slate-400 transition';
      render();
    }

    // 8등신 전신 타로 일러스트 렌더러
    function drawTarotCard(canvas, cardId, deckId, revealed = true) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const deckTheme = {
        classic: { bg1: '#1e1b4b', bg2: '#312e81', accent: '#fbbf24', robe: '#1d4ed8', fur: '#fde68a', ear: false },
        cat:     { bg1: '#2e1065', bg2: '#701a75', accent: '#f472b6', robe: '#4c1d95', fur: '#fffbeb', ear: 'cat' },
        rabbit:  { bg1: '#064e3b', bg2: '#115e59', accent: '#6ee7b7', robe: '#047857', fur: '#ffffff', ear: 'rabbit' },
        neon:    { bg1: '#090d16', bg2: '#1e1b4b', accent: '#22d3ee', robe: '#0f172a', fur: '#e0f2fe', ear: 'neon' }
      }[deckId || state.activeDeck];

      // 뒷면 렌더링
      if (!revealed) {
        const g = ctx.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, deckTheme.bg1);
        g.addColorStop(1, deckTheme.bg2);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = deckTheme.accent;
        ctx.lineWidth = 4;
        ctx.strokeRect(10, 10, w - 20, h - 20);
        ctx.fillStyle = deckTheme.accent;
        ctx.font = 'bold 28px Cinzel, serif';
        ctx.textAlign = 'center';
        ctx.fillText('🔮', w / 2, h / 2 - 6);
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('ARCANA LIVE', w / 2, h / 2 + 22);
        return;
      }

      const card = getCardInfo(cardId);

      // 배경 그라데이션 & 후광
      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, deckTheme.bg1);
      bgGrad.addColorStop(0.65, deckTheme.bg2);
      bgGrad.addColorStop(1, '#0f0a1e');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 성당 아치 & 빛줄기
      const halo = ctx.createRadialGradient(w / 2, h * 0.25, 8, w / 2, h * 0.25, w * 0.45);
      halo.addColorStop(0, 'rgba(253, 224, 71, 0.55)');
      halo.addColorStop(1, 'rgba(253, 224, 71, 0)');
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(251, 191, 36, 0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(w / 2, h * 0.26, w * 0.28, Math.PI, 0);
      ctx.lineTo(w * 0.78, h * 0.84);
      ctx.lineTo(w * 0.22, h * 0.84);
      ctx.closePath();
      ctx.stroke();

      // 8등신 전신 캐릭터 비율 계산 (총 신장 = h * 0.66, 머리 = 신장의 1/8)
      const topY = h * 0.16;
      const totalH = h * 0.68;
      const headUnit = totalH / 8;
      const cx = w / 2;

      // 바닥 그림자
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.ellipse(cx, topY + totalH, headUnit * 1.4, headUnit * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();

      // 고양이 꼬리 (냥이 덱)
      if (deckTheme.ear === 'cat') {
        ctx.strokeStyle = deckTheme.fur;
        ctx.lineWidth = headUnit * 0.28;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx + headUnit * 0.4, topY + headUnit * 4.2);
        ctx.quadraticCurveTo(cx + headUnit * 2.1, topY + headUnit * 3.6, cx + headUnit * 1.6, topY + headUnit * 2.3);
        ctx.stroke();
      }

      // 8등신 롱다리 & 사이하이 부츠 (4.2 ~ 8.0 등신)
      const hipY = topY + headUnit * 4.0;
      const footY = topY + totalH;
      ctx.strokeStyle = '#1e1b4b';
      ctx.lineWidth = headUnit * 0.34;
      ctx.lineCap = 'round';
      // 왼다리
      ctx.beginPath();
      ctx.moveTo(cx - headUnit * 0.28, hipY);
      ctx.lineTo(cx - headUnit * 0.36, footY - 2);
      ctx.stroke();
      // 오른다리 (살짝 교차된 화보 포즈)
      ctx.beginPath();
      ctx.moveTo(cx + headUnit * 0.28, hipY);
      ctx.lineTo(cx + headUnit * 0.22, footY);
      ctx.stroke();

      // 8등신 하이슬릿 사제 로브 / 드레스 (어깨 1.5 ~ 발목 7.7 등신)
      const shoulderY = topY + headUnit * 1.45;
      const waistY = topY + headUnit * 2.9;
      ctx.fillStyle = deckTheme.robe;
      ctx.beginPath();
      ctx.moveTo(cx - headUnit * 0.65, shoulderY);
      ctx.lineTo(cx + headUnit * 0.65, shoulderY);
      ctx.lineTo(cx + headUnit * 0.42, waistY);
      ctx.lineTo(cx + headUnit * 1.25, footY - headUnit * 0.25);
      ctx.lineTo(cx + headUnit * 0.12, footY - headUnit * 0.25);
      ctx.lineTo(cx - headUnit * 0.05, hipY + headUnit * 0.4); // 우아한 트임(슬릿)
      ctx.lineTo(cx - headUnit * 0.45, footY - headUnit * 0.25);
      ctx.lineTo(cx - headUnit * 1.15, footY - headUnit * 0.25);
      ctx.lineTo(cx - headUnit * 0.42, waistY);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = deckTheme.accent;
      ctx.lineWidth = 1.6;
      ctx.stroke();

      // 금박 허리 코르셋 & 숄
      ctx.fillStyle = deckTheme.accent;
      ctx.fillRect(cx - headUnit * 0.42, waistY - 2, headUnit * 0.84, 5);

      // 양팔과 성물 (지팡이/초승달)
      ctx.strokeStyle = deckTheme.fur;
      ctx.lineWidth = headUnit * 0.22;
      ctx.beginPath();
      ctx.moveTo(cx - headUnit * 0.62, shoulderY + 2);
      ctx.lineTo(cx - headUnit * 1.15, waistY + headUnit * 0.4);
      ctx.moveTo(cx + headUnit * 0.62, shoulderY + 2);
      ctx.lineTo(cx + headUnit * 1.1, shoulderY - headUnit * 0.4);
      ctx.stroke();

      // 황금 지팡이
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx + headUnit * 1.15, topY + headUnit * 0.3);
      ctx.lineTo(cx + headUnit * 1.15, footY);
      ctx.stroke();

      // 8등신 머리 (1/8 비율)
      const headR = headUnit * 0.48;
      const headCy = topY + headR + 2;

      // 컨셉별 귀 / 왕관
      if (deckTheme.ear === 'cat') {
        ctx.fillStyle = deckTheme.fur;
        ctx.beginPath();
        ctx.moveTo(cx - headR * 0.9, headCy - headR * 0.4);
        ctx.lineTo(cx - headR * 1.1, headCy - headR * 1.55);
        ctx.lineTo(cx - headR * 0.2, headCy - headR * 0.85);
        ctx.moveTo(cx + headR * 0.9, headCy - headR * 0.4);
        ctx.lineTo(cx + headR * 1.1, headCy - headR * 1.55);
        ctx.lineTo(cx + headR * 0.2, headCy - headR * 0.85);
        ctx.fill();
      } else if (deckTheme.ear === 'rabbit') {
        ctx.fillStyle = deckTheme.fur;
        ctx.beginPath();
        ctx.ellipse(cx - headR * 0.45, headCy - headR * 1.7, headR * 0.24, headR * 0.95, -0.15, 0, Math.PI * 2);
        ctx.ellipse(cx + headR * 0.45, headCy - headR * 1.7, headR * 0.24, headR * 0.95, 0.15, 0, Math.PI * 2);
        ctx.fill();
      }

      // 얼굴
      ctx.fillStyle = deckTheme.fur;
      ctx.beginPath();
      ctx.arc(cx, headCy, headR, 0, Math.PI * 2);
      ctx.fill();

      // 초승달 티아라
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, headCy - headR * 0.95, headR * 0.35, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();

      // 눈동자
      ctx.fillStyle = deckTheme.ear === 'neon' ? '#22d3ee' : '#1e1b4b';
      ctx.beginPath();
      ctx.arc(cx - headR * 0.35, headCy, headR * 0.14, 0, Math.PI * 2);
      ctx.arc(cx + headR * 0.35, headCy, headR * 0.14, 0, Math.PI * 2);
      ctx.fill();

      // 아르누보 금박 보더 & 명판
      ctx.strokeStyle = deckTheme.accent;
      ctx.lineWidth = 3;
      ctx.strokeRect(6, 6, w - 12, h - 12);

      ctx.fillStyle = 'rgba(9, 7, 20, 0.85)';
      ctx.fillRect(10, h - 34, w - 20, 24);
      ctx.fillStyle = '#fde68a';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${card.num}. ${card.name.split(' ')[0]}`, w / 2, h - 18);
    }

    function openCardModal(cardId, deckId) {
      const card = getCardInfo(cardId);
      const deck = DECKS.find(d => d.id === (deckId || state.activeDeck));
      document.getElementById('modalDeckBadge').textContent = deck.name;
      document.getElementById('modalCardTitle').textContent = `${card.num}. ${card.name}`;
      document.getElementById('modalCardKeywords').textContent = card.kw;
      document.getElementById('modalCardDesc').textContent = card.desc;
      document.getElementById('cardModal').classList.remove('hidden');
      drawTarotCard(document.getElementById('modalCardCanvas'), cardId, deck.id, true);
    }

    function closeCardModal() {
      document.getElementById('cardModal').classList.add('hidden');
    }

    // 상담사 액션
    function drawNewCards() {
      const pool = [0, 1, 2, 3, 6, 9, 17, 19, 21].sort(() => Math.random() - 0.5);
      state.drawnCards = [
        { id: pool[0], revealed: false },
        { id: pool[1], revealed: false },
        { id: pool[2], revealed: false }
      ];
      showToast('🃏 새 타로 카드 3장을 뽑았습니다 (상담사 선확인 가능)');
      render();
    }

    function toggleReveal(idx) {
      state.drawnCards[idx].revealed = !state.drawnCards[idx].revealed;
      showToast(state.drawnCards[idx].revealed ? '✨ 내담자 화면에 카드를 공개했습니다!' : '🔒 카드를 비공개로 전환했습니다');
      render();
    }

    function buyOrEquipDeck(deckId) {
      const deck = DECKS.find(d => d.id === deckId);
      if (state.ownedDecks.includes(deckId)) {
        state.activeDeck = deckId;
        showToast(`${deck.name} 덱을 방송에 장착했습니다!`);
      } else {
        if (state.counselorCoin < deck.price) {
          showToast('상담사 문코인이 부족합니다! 상단에서 충전해 주세요.');
          return;
        }
        state.counselorCoin -= deck.price;
        state.platformRevenue += deck.price;
        state.ownedDecks.push(deckId);
        state.activeDeck = deckId;
        updateCoins();
        showToast(`🎉 ${deck.name} 구매 및 장착 완료!`);
      }
      render();
    }

    function sendThankReply(user, tplKey) {
      const raw = state.replyTemplates[tplKey] || '{닉네임}님 감사합니다!';
      const msg = raw.replace('{닉네임}', user).replace('{링크}', 'arcana.live/room1');
      state.chats.push({ source: 'arcana', user: '🔮 루나 상담사', text: msg, coin: 0 });
      if (navigator.clipboard) navigator.clipboard.writeText(msg).catch(() => {});
      showToast('📋 감사 답장이 전송되고 클립보드에 자동 복사되었습니다!');
      render();
    }

    function addCustomTemplate() {
      const input = document.getElementById('newTplInput');
      if (!input || !input.value.trim()) return;
      state.replyTemplates[state.selectedCategory] = input.value.trim();
      showToast(`✅ [${state.selectedCategory}] 감사 멘트가 저장되었습니다!`);
      render();
    }

    // 내담자 액션
    function sendClientChat() {
      const inp = document.getElementById('clientChatInput');
      if (!inp || !inp.value.trim()) return;
      state.chats.push({ source: 'arcana', user: '나(내담자)', text: inp.value.trim(), coin: 0 });
      inp.value = '';
      render();
    }

    function sendDonation(amount) {
      if (state.clientCoin < amount) {
        showToast('내담자 문코인이 부족합니다! 상단에서 충전해 주세요.');
        return;
      }
      const fee = Math.round(amount * 0.08);
      state.clientCoin -= amount;
      state.counselorCoin += (amount - fee);
      state.platformRevenue += fee;
      state.chats.push({ source: 'arcana', user: '나(내담자)', text: `복채 ${amount.toLocaleString()} MC 후원합니다! 🔮`, coin: amount });
      updateCoins();
      showToast(`✨ ${amount.toLocaleString()} MC 복채를 전달했습니다!`);
      render();
    }
